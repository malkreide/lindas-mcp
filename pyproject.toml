[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lindas-mcp"
version = "0.2.1"
description = "MCP server for LINDAS — the Swiss administration's linked-data knowledge graph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "malkreide" }]
keywords = ["mcp", "model-context-protocol", "llm", "swiss-open-data", "lindas", "sparql", "linked-data", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Upper bound added deliberately: `mcp` 2.0.0 removed `mcp.server.fastmcp`
# outright (the API moved to `mcp.server.mcpserver`), so an unbounded
# `>=1.28.1` breaks every fresh install — CI and `pip install` alike.
# Migrating to the 2.x API is real work and a decision to take on purpose,
# not one a resolver should make silently.
dependencies = ["mcp>=2.0.0,<3", "httpx>=0.27", "pydantic>=2.7", "structlog>=24.1,<27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff==0.16.5"]

[project.scripts]
lindas-mcp = "lindas_mcp.server:main"

[project.urls]
Homepage = "https://github.com/malkreide/lindas-mcp"
Repository = "https://github.com/malkreide/lindas-mcp"
Issues = "https://github.com/malkreide/lindas-mcp/issues"
"Data source" = "https://lindas.admin.ch"
Portfolio = "https://github.com/malkreide/swiss-public-data-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/lindas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real LINDAS endpoint (excluded from CI)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
