name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # Umfang schliesst `scripts/` ein. Vorher stand hier `src/ tests/`,
      # waehrend unter `scripts/` zwei Python-Dateien liegen — darunter
      # `classify_live_run.py`, das entscheidet, ob ein roter Live-Lauf ein
      # Issue aufmacht. Sie waren von beiden Gates nicht erfasst und konnten
      # ungehindert driften. Gemessen vor dem Einbau: beide Dateien sind heute
      # sauber, das Gate ist ab der ersten Minute gruen.
      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint
        run: ruff check src/ tests/ scripts/

      # Zweites, eigenstaendiges Gate. `ruff check` belegt kein Format: ein
      # gruener Linter neben einem roten `ruff format --check` ist ein
      # gewoehnlicher Zustand, kein Widerspruch — die beiden pruefen
      # Verschiedenes. Der Regelsatz oben steht in `select`, hier ist das
      # Ergebnis selbst das Kriterium.
      #
      # Eigener Schritt, damit im Log steht, welches der beiden Gates
      # ausgeloest hat. In einen Schritt zusammengezogen waere die Antwort auf
      # «warum ist die CI rot» eine Suche statt eine Zeile.
      #
      # Kein `--line-length`: die Breite entscheidet die `[tool.ruff]`-Sektion
      # in pyproject.toml, nicht dieser Workflow.
      #
      # Gleicher Umfang wie `ruff check` eine Zeile hoeher — zwei Gates mit
      # zwei Reichweiten sehen aus wie ein Gate.
      #
      # Gemessen vor jeder Erweiterung, damit das Gate ab der ersten Minute
      # gruen ist und nichts umformatiert: beim Einbau «13 files already
      # formatted» ueber `src/ tests/`, beim Hinzunehmen von `scripts/`
      # «19 files already formatted» ueber alle drei.
      - name: Format
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
